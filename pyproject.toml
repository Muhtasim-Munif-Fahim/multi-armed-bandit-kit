[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-armed-bandit-kit"
version = "0.1.0"
description = "Multi-armed bandit algorithms, experiments, and reporting for reproducible research."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = = [{name = "Muhtasim-Munif-Fahim"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
bandit-kit = "bandit_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]